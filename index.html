
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipMaster AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101323;
  color: white;
  text-align: center;
}
header {
  padding: 22px;
  font-size: 25px;
  font-weight: bold;
  color: #7c9cff;
}
main {
  max-width: 550px;
  margin: 45px auto;
  padding: 25px;
}
.panel {
  background: #1c2238;
  padding: 25px;
  border-radius: 16px;
}
input, button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border-radius: 9px;
  border: none;
}
button {
  background: #647eff;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
.note { color: #adb6d1; font-size: 13px; }
</style>
</head>
<body>
<header>⚡ ClipMaster AI</header>
<main>
  <div class="panel">
    <h1>Turn Long Videos Into Shorts</h1>
    <p>AI-powered video clipping platform</p>
    <input type="file" accept="video/*" id="video">
    <button onclick="uploadVideo()">Start Clipping</button>
    <p id="message" class="note">Upload a video to get started.</p>
  </div>
  <p class="note">Urdu & English captions | 9:16 Shorts</p>
</main>
<script>
function uploadVideo() {
  const file = document.getElementById("video").files[0];
  const message = document.getElementById("message");
  if (!file) {
    message.textContent = "Please select a video first.";
    return;
  }
  message.textContent =
    "Video selected: " + file.name +
    ". AI processing will be added in the next version.";
}
</script>
</body>
</html>
