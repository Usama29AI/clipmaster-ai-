
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - ClipMaster AI</title>

<link rel="stylesheet" href="style.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
}

.login-box {
  width: 100%;
  max-width: 420px;
  background: #151f37;
  border: 1px solid #293653;
  border-radius: 18px;
  padding: 30px;
  text-align: center;
}

.logo {
  font-size: 27px;
  font-weight: bold;
  color: #91a9ff;
  margin-bottom: 12px;
}

h2 {
  margin-bottom: 8px;
}

.subtitle {
  color: #9caaca;
  font-size: 14px;
  margin-bottom: 25px;
}

form {
  text-align: left;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #c5cde0;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 20px;
  border: 1px solid #354363;
  border-radius: 9px;
  background: #0d1528;
  color: white;
  font-size: 15px;
}

input:focus {
  outline: 2px solid #657fff;
}

.login-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 9px;
  background: #657fff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.login-btn:hover {
  opacity: 0.85;
}

.message {
  margin-top: 18px;
  color: #91a9ff;
  font-size: 13px;
  line-height: 1.5;
}

.back {
  display: inline-block;
  margin-top: 22px;
  color: #91a9ff;
  text-decoration: none;
}

.back:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">ClipMaster AI</div>

  <h2>Welcome Back!</h2>

  <p class="subtitle">
    Login to your video editing studio
  </p>

  <form id="loginForm">

    <label for="email">Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button type="submit" class="login-btn">
      Login
    </button>

  </form>

  <div class="message" id="message"></div>

  <a href="index.html" class="back">
    ← Back to Home
  </a>

</div>

<script>
document.getElementById("loginForm")
.addEventListener("submit", function(event) {

  event.preventDefault();

  document.getElementById("message").textContent =
    "Login interface ready. Real account authentication will be added in Phase 3.";

});
</script>

</body>
</html>
